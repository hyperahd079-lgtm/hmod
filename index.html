<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>HAND MOTION</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03050b;
    color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}

body{
    position:relative;
}

/* =========================
   الكاميرا الخلفية
========================= */

#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    transform:none;
    background:#03050b;
}

/* =========================
   إضاءة الشاشة
========================= */

#shade{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 50% 45%,
            transparent 0 15%,
            rgba(0,0,0,.10) 42%,
            rgba(0,0,0,.72) 100%
        ),
        linear-gradient(
            180deg,
            rgba(0,0,0,.62),
            transparent 30%,
            transparent 70%,
            rgba(0,0,0,.78)
        );
}

/* =========================
   Canvas
========================= */

#canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

/* =========================
   UI
========================= */

.ui{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
}

.top{
    position:absolute;
    top:18px;
    left:16px;
    right:16px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    padding:9px 15px;

    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;

    background:rgba(8,11,21,.48);

    backdrop-filter:blur(18px);

    font-weight:800;
    letter-spacing:1px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);
}

.status{
    display:flex;
    gap:8px;
    align-items:center;

    padding:8px 13px;

    border-radius:999px;

    background:rgba(8,11,21,.68);

    border:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(18px);

    font-size:12px;
    color:#d5dcef;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#ffb020;

    box-shadow:0 0 14px #ffb020;

    transition:.3s;
}

.dot.ok{
    background:#55ffb0;
    box-shadow:0 0 18px #55ffb0;
}

/* =========================
   الشاشة الأولى
========================= */

.center{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    width:min(90%,540px);

    transition:.5s;

    opacity:1;
}

.center.hidden{
    opacity:0;

    transform:
        translate(-50%,-47%)
        scale(.94);

    pointer-events:none;
}

h1{
    margin:0 0 10px;

    font-size:clamp(38px,10vw,76px);

    font-weight:900;

    letter-spacing:-3px;

    text-shadow:
        0 8px 45px rgba(0,0,0,.9);
}

.sub{
    font-size:15px;

    color:#d8deef;

    line-height:1.9;

    text-shadow:
        0 3px 20px rgba(0,0,0,.9);
}

#start{
    pointer-events:auto;

    margin-top:24px;

    border:0;

    color:#070b12;

    background:#fff;

    padding:14px 25px;

    border-radius:999px;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 12px 40px rgba(0,0,0,.55);

    transition:.2s;
}

#start:active{
    transform:scale(.94);
}

/* =========================
   لوحة المعلومات
========================= */

.panel{
    position:absolute;

    bottom:70px;
    right:16px;

    display:none;

    width:min(285px,calc(100% - 32px));

    padding:14px 16px;

    border-radius:20px;

    background:rgba(7,10,20,.67);

    border:1px solid rgba(255,255,255,.09);

    backdrop-filter:blur(20px);

    box-shadow:
        0 18px 55px rgba(0,0,0,.5);
}

.panel.show{
    display:block;
}

.row{
    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:6px 0;

    color:#bfc7dc;

    font-size:12px;
}

.row b{
    color:#fff;
}

/* =========================
   التلميح
========================= */

.tip{
    position:absolute;

    bottom:22px;
    left:50%;

    transform:translateX(-50%);

    width:max-content;

    max-width:calc(100% - 28px);

    padding:10px 16px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius:999px;

    background:
        rgba(7,10,20,.68);

    backdrop-filter:blur(16px);

    font-size:12px;

    color:#d4daea;

    text-align:center;
}

/* =========================
   الخطأ
========================= */

.cameraError{
    display:none;

    position:fixed;

    z-index:10;

    inset:0;

    place-items:center;

    background:rgba(3,5,11,.96);

    padding:24px;

    text-align:center;
}

.cameraError.show{
    display:grid;
}

.card{
    max-width:420px;

    padding:26px;

    border-radius:25px;

    background:#0b1020;

    border:
        1px solid rgba(255,255,255,.09);

    box-shadow:
        0 25px 80px rgba(0,0,0,.75);
}

.card h2{
    margin:0 0 10px;
}

.card p{
    color:#b8c0d5;

    line-height:1.8;

    font-size:14px;
}

#retry{
    border:0;

    padding:12px 22px;

    border-radius:999px;

    font-weight:900;

    cursor:pointer;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<div id="shade"></div>

<canvas id="canvas"></canvas>

<div class="ui">

    <div class="top">

        <div class="brand">
            HAND MOTION
        </div>

        <div class="status">

            <span id="dot" class="dot"></span>

            <span id="status">
                بانتظار الكاميرا
            </span>

        </div>

    </div>


    <div id="center" class="center">

        <h1>حرّك يدك</h1>

        <div class="sub">

            خلي إيدك قدام
            <b>الكاميرا الخلفية</b>

            <br>

            والموقع راح يتفاعل ويا كل حركة ✋

        </div>

        <button id="start">
            تشغيل الكاميرا الخلفية
        </button>

    </div>


    <div id="panel" class="panel">

        <div class="row">
            <span>الحالة</span>
            <b id="handState">لا توجد يد</b>
        </div>

        <div class="row">
            <span>الحركة</span>
            <b id="gesture">—</b>
        </div>

        <div class="row">
            <span>الموقع</span>
            <b id="pos">—</b>
        </div>

    </div>


    <div class="tip">

        🖐️ نار
        &nbsp; • &nbsp;
        ✌️ طاقة
        &nbsp; • &nbsp;
        ☝️ رسم
        &nbsp; • &nbsp;
        ✊ إخفاء

    </div>

</div>


<div id="error" class="cameraError">

    <div class="card">

        <h2>
            ما قدرنا نفتح الكاميرا
        </h2>

        <p id="errorText">
            تأكد من إعطاء الموقع صلاحية الكاميرا.
        </p>

        <button id="retry">
            إعادة المحاولة
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

/* =========================================================
   العناصر
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const start =
    document.getElementById("start");

const center =
    document.getElementById("center");

const statusEl =
    document.getElementById("status");

const dot =
    document.getElementById("dot");

const panel =
    document.getElementById("panel");

const handState =
    document.getElementById("handState");

const gestureEl =
    document.getElementById("gesture");

const posEl =
    document.getElementById("pos");

const error =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");


/* =========================================================
   المتغيرات
========================================================= */

let stream = null;

let hands = null;

let running = false;

let particles = [];

let bursts = [];

let rings = [];

let hearts = [];

let trails = [];

let flames = [];

let energy = [];

let drawing = [];

let previousHand = null;

let lastGesture = "";

let gestureTimer = 0;

let lastTime = performance.now();


/* =========================================================
   حجم الشاشة
========================================================= */

function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        innerWidth * dpr;

    canvas.height =
        innerHeight * dpr;

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   أدوات
========================================================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function screenPoint(p){

    return {

        x:p.x * innerWidth,

        y:p.y * innerHeight

    };
}


/* =========================================================
   الجسيمات الخلفية
========================================================= */

function createParticles(){

    particles=[];

    for(let i=0;i<130;i++){

        particles.push({

            x:Math.random()*innerWidth,

            y:Math.random()*innerHeight,

            vx:(Math.random()-.5)*.3,

            vy:(Math.random()-.5)*.3,

            r:Math.random()*2+0.4,

            a:Math.random()*.65+.1

        });

    }
}

createParticles();


/* =========================================================
   انفجار
========================================================= */

function burst(
    x,
    y,
    count=45,
    power=6
){

    for(let i=0;i<count;i++){

        const angle =
            Math.random() *
            Math.PI*2;

        const speed =
            Math.random()*power
            + power*.2;

        bursts.push({

            x,
            y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            size:
                Math.random()*3+1,

            life:1,

            decay:
                Math.random()*.018+.012

        });

    }

    rings.push({

        x,
        y,

        r:5,

        max:120,

        life:1

    });
}


/* =========================================================
   نار حول اليد
========================================================= */

function spawnFlame(x,y){

    flames.push({

        x:
            x + (Math.random()-.5)*65,

        y:
            y + (Math.random()-.5)*65,

        vx:
            (Math.random()-.5)*1.4,

        vy:
            -Math.random()*3.5-1,

        size:
            Math.random()*15+7,

        life:1,

        decay:
            Math.random()*.025+.018,

        rotation:
            Math.random()*Math.PI*2

    });

}


/* =========================================================
   طاقة
========================================================= */

function spawnEnergy(x,y){

    energy.push({

        x,

        y,

        vx:(Math.random()-.5)*4,

        vy:(Math.random()-.5)*4,

        size:Math.random()*3+1,

        life:1

    });

}


/* =========================================================
   تحديد الأصابع
========================================================= */

function fingerInfo(lm){

    const index =
        lm[8].y < lm[6].y;

    const middle =
        lm[12].y < lm[10].y;

    const ring =
        lm[16].y < lm[14].y;

    const pinky =
        lm[20].y < lm[18].y;

    const pinch =
        distance(lm[4],lm[8]) < .075;

    return {

        index,

        middle,

        ring,

        pinky,

        pinch

    };
}


/* =========================================================
   التعرف على الحركة
========================================================= */

function classify(lm){

    const f =
        fingerInfo(lm);


    /* قلب */

    const twoFingerHeart =

        f.index &&
        f.middle &&
        !f.ring &&
        !f.pinky &&
        distance(
            lm[8],
            lm[12]
        ) < .105;


    if(twoFingerHeart){

        return "🫶 قلب";

    }


    /* ضم */

    if(f.pinch){

        return "🤏 ضم";

    }


    /* كف مفتوح */

    if(
        f.index &&
        f.middle &&
        f.ring &&
        f.pinky
    ){

        return "🖐️ كف مفتوح";

    }


    /* سلام */

    if(
        f.index &&
        f.middle &&
        !f.ring &&
        !f.pinky
    ){

        return "✌️ سلام";

    }


    /* سبابة */

    if(
        f.index &&
        !f.middle &&
        !f.ring &&
        !f.pinky
    ){

        return "☝️ سبابة";

    }


    /* إعجاب */

    const thumbUp =

        lm[4].y <
        lm[3].y &&

        !f.index &&
        !f.middle &&
        !f.ring &&
        !f.pinky;


    if(thumbUp){

        return "👍 إعجاب";

    }


    /* قبضة */

    if(
        !f.index &&
        !f.middle &&
        !f.ring &&
        !f.pinky
    ){

        return "✊ قبضة";

    }


    return "👋 حركة";

}


/* =========================================================
   تأثيرات الحركة
========================================================= */

function gestureEffect(
    gesture,
    lm
){

    const now =
        performance.now();

    if(now < gestureTimer)
        return;

    gestureTimer =
        now + 180;


    const c =
        screenPoint(lm[9]);


    /* كف = نار */

    if(
        gesture.includes("كف")
    ){

        burst(
            c.x,
            c.y,
            35,
            4
        );

        rings.push({

            x:c.x,

            y:c.y,

            r:20,

            max:180,

            life:1

        });

    }


    /* سلام = طاقة */

    else if(
        gesture.includes("سلام")
    ){

        burst(
            screenPoint(lm[8]).x,
            screenPoint(lm[8]).y,
            18,
            4
        );

        burst(
            screenPoint(lm[12]).x,
            screenPoint(lm[12]).y,
            18,
            4
        );

    }


    /* سبابة = بداية الرسم */

    else if(
        gesture.includes("سبابة")
    ){

        burst(
            screenPoint(lm[8]).x,
            screenPoint(lm[8]).y,
            12,
            3
        );

    }


    /* قبضة = إخفاء */

    else if(
        gesture.includes("قبضة")
    ){

        burst(
            c.x,
            c.y,
            25,
            3
        );

    }


    /* إعجاب */

    else if(
        gesture.includes("إعجاب")
    ){

        burst(
            screenPoint(lm[4]).x,
            screenPoint(lm[4]).y,
            28,
            4
        );

    }

}


/* =========================================================
   رسم اليد
========================================================= */

function drawHand(lm){

    const connections=[

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [5,9],[9,10],[10,11],[11,12],

        [9,13],[13,14],[14,15],[15,16],

        [13,17],[17,18],[18,19],[19,20],

        [0,17]

    ];


    for(
        const c of connections
    ){

        const a =
            screenPoint(lm[c[0]]);

        const b =
            screenPoint(lm[c[1]]);

        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.25)";

        ctx.lineWidth=1.3;

        ctx.shadowBlur=8;

        ctx.shadowColor =
            "rgba(180,220,255,.4)";

        ctx.stroke();

    }


    for(
        let i=0;
        i<lm.length;
        i++
    ){

        const p =
            screenPoint(lm[i]);

        const important =
            [4,8,12,16,20]
            .includes(i);

        ctx.beginPath();

        ctx.arc(

            p.x,

            p.y,

            important ? 4 : 2.2,

            0,

            Math.PI*2

        );

        ctx.fillStyle =

            important

            ? "rgba(255,255,255,.95)"

            : "rgba(220,235,255,.65)";

        ctx.shadowBlur =
            important ? 15 : 5;

        ctx.shadowColor =
            "rgba(180,220,255,.8)";

        ctx.fill();

    }

    ctx.shadowBlur=0;

}


/* =========================================================
   رسم شعاع الإصبع
========================================================= */

function drawFingerBeam(lm){

    const tip =
        screenPoint(lm[8]);

    const joint =
        screenPoint(lm[6]);


    const dx =
        tip.x-joint.x;

    const dy =
        tip.y-joint.y;

    const len =
        Math.hypot(dx,dy)||1;

    const nx =
        dx/len;

    const ny =
        dy/len;


    const endX =
        tip.x + nx*220;

    const endY =
        tip.y + ny*220;


    const gradient =
        ctx.createLinearGradient(

            tip.x,
            tip.y,
            endX,
            endY

        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,.95)"
    );

    gradient.addColorStop(
        .25,
        "rgba(140,220,255,.65)"
    );

    gradient.addColorStop(
        1,
        "rgba(140,220,255,0)"
    );


    ctx.beginPath();

    ctx.moveTo(
        tip.x,
        tip.y
    );

    ctx.lineTo(
        endX,
        endY
    );

    ctx.strokeStyle =
        gradient;

    ctx.lineWidth=2;

    ctx.shadowBlur=22;

    ctx.shadowColor =
        "rgba(120,220,255,.9)";

    ctx.stroke();

    ctx.shadowBlur=0;

}


/* =========================================================
   الرسم بالسبابة
========================================================= */

function drawDrawing(){

    if(drawing.length < 2)
        return;


    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        drawing[0].x,
        drawing[0].y
    );


    for(
        let i=1;
        i<drawing.length;
        i++
    ){

        const p =
            drawing[i];

        ctx.lineTo(
            p.x,
            p.y
        );

    }


    ctx.strokeStyle =
        "rgba(130,220,255,.9)";

    ctx.lineWidth=4;

    ctx.lineCap="round";

    ctx.lineJoin="round";

    ctx.shadowBlur=20;

    ctx.shadowColor =
        "rgba(100,220,255,.9)";

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   النتائج
========================================================= */

let hand = {

    found:false,

    x:.5,

    y:.5,

    gesture:"—",

    points:null

};


function onResults(results){

    if(
        !results.multiHandLandmarks ||
        !results.multiHandLandmarks.length
    ){

        hand.found=false;

        statusEl.textContent =
            "وجّه يدك للكاميرا";

        dot.classList.remove("ok");

        handState.textContent =
            "لا توجد يد";

        gestureEl.textContent =
            "—";

        posEl.textContent =
            "—";

        panel.classList.remove("show");

        previousHand=null;

        return;

    }


    const lm =
        results.multiHandLandmarks[0];


    hand.found=true;

    hand.x =
        lm[9].x;

    hand.y =
        lm[9].y;

    hand.points=lm;


    hand.gesture =
        classify(lm);


    statusEl.textContent =
        "تم اكتشاف اليد";

    dot.classList.add("ok");


    handState.textContent =
        "موجودة ✋";


    gestureEl.textContent =
        hand.gesture;


    posEl.textContent =

        Math.round(hand.x*100) +

        "% ، " +

        Math.round(hand.y*100) +

        "%";


    panel.classList.add("show");


    /* تأثير عند تغير الحركة */

    if(
        hand.gesture !== lastGesture
    ){

        gestureEffect(
            hand.gesture,
            lm
        );

        lastGesture =
            hand.gesture;

    }


    /* =========================================
       النار أثناء الكف المفتوح
    ========================================= */

    if(
        hand.gesture.includes("كف")
    ){

        const c =
            screenPoint(lm[9]);

        for(let i=0;i<3;i++){

            spawnFlame(
                c.x,
                c.y
            );

        }

    }


    /* =========================================
       الطاقة أثناء السلام
    ========================================= */

    if(
        hand.gesture.includes("سلام")
    ){

        const p1 =
            screenPoint(lm[8]);

        const p2 =
            screenPoint(lm[12]);


        spawnEnergy(
            p1.x,
            p1.y
        );

        spawnEnergy(
            p2.x,
            p2.y
        );

    }


    /* =========================================
       الرسم أثناء السبابة
    ========================================= */

    if(
        hand.gesture.includes("سبابة")
    ){

        const tip =
            screenPoint(lm[8]);


        if(
            !previousHand ||
            distance(
                tip,
                previousHand
            ) > 2
        ){

            drawing.push({

                x:tip.x,

                y:tip.y

            });

        }


        /*
         * حتى لا يصبح الرسم لا نهائي
         */

        if(drawing.length > 700){

            drawing.shift();

        }

    }


    /* إذا مو سبابة لا نضيف نقاط */

    else{

        /*
         * نخلي الرسم يبقى على الشاشة
         * ولا ينمسح بمجرد تغيير الحركة
         */

    }


    /* رسم اليد */

    drawHand(lm);


    /* شعاع الإصبع */

    if(
        hand.gesture.includes("سبابة")
    ){

        drawFingerBeam(lm);

    }


    /* =========================================
       حركة اليد
    ========================================= */

    if(previousHand){

        const current =
            screenPoint(lm[9]);

        const movement =
            Math.hypot(

                current.x-previousHand.x,

                current.y-previousHand.y

            );


        if(movement > 3){

            trails.push({

                x:current.x,

                y:current.y,

                life:1,

                size:
                    Math.min(
                        20,
                        movement*1.5
                    )

            });


            if(movement > 14){

                burst(
                    current.x,
                    current.y,
                    4,
                    2.5
                );

            }

        }

    }


    previousHand =
        screenPoint(lm[9]);

}


/* =========================================================
   Animation
========================================================= */

function animate(now){

    const dt =
        Math.min(
            32,
            now-lastTime
        );

    lastTime=now;


    ctx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );


    /* =========================================
       الرسم
    ========================================= */

    drawDrawing();


    const targetX =
        hand.found
        ? hand.x*innerWidth
        : innerWidth/2;


    const targetY =
        hand.found
        ? hand.y*innerHeight
        : innerHeight/2;


    /* =========================================
       الجسيمات الخلفية
    ========================================= */

    for(
        const p of particles
    ){

        const dx =
            targetX-p.x;

        const dy =
            targetY-p.y;

        const d =
            Math.hypot(dx,dy)||1;


        if(
            hand.found &&
            d<350
        ){

            const force =
                ((350-d)/350)*.8;

            p.vx +=
                dx/d*force;

            p.vy +=
                dy/d*force;

        }


        p.vx*=.985;

        p.vy*=.985;


        p.x +=
            p.vx*dt*.06;

        p.y +=
            p.vy*dt*.06;


        if(p.x<-20)
            p.x=innerWidth+20;

        if(p.x>innerWidth+20)
            p.x=-20;

        if(p.y<-20)
            p.y=innerHeight+20;

        if(p.y>innerHeight+20)
            p.y=-20;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            `rgba(220,235,255,${p.a})`;

        ctx.fill();

    }


    /* =========================================
       هالة اليد
    ========================================= */

    if(hand.found){

        const pulse =
            85 +
            Math.sin(now*.006)*12;


        const g =
            ctx.createRadialGradient(

                targetX,
                targetY,
                0,

                targetX,
                targetY,
                pulse

            );


        g.addColorStop(
            0,
            "rgba(255,255,255,.18)"
        );

        g.addColorStop(
            .3,
            "rgba(150,210,255,.10)"
        );

        g.addColorStop(
            1,
            "rgba(150,210,255,0)"
        );


        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            targetX,
            targetY,
            pulse,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* =========================================
       النار
    ========================================= */

    for(
        let i=flames.length-1;
        i>=0;
        i--
    ){

        const f =
            flames[i];


        f.x +=
            f.vx*dt*.06;

        f.y +=
            f.vy*dt*.06;


        f.vy +=
            .025;


        f.life -=
            f.decay*dt;


        f.size *=
            .985;


        ctx.save();

        ctx.translate(
            f.x,
            f.y
        );

        ctx.rotate(
            f.rotation
        );


        /*
         * شكل لهب ناعم
         */

        const flame =
            ctx.createRadialGradient(

                0,
                0,
                0,

                0,
                0,
                f.size

            );


        flame.addColorStop(
            0,
            `rgba(255,255,255,${Math.max(0,f.life)})`
        );

        flame.addColorStop(
            .22,
            `rgba(255,210,90,${Math.max(0,f.life*.9)})`
        );

        flame.addColorStop(
            .55,
            `rgba(255,110,20,${Math.max(0,f.life*.65)})`
        );

        flame.addColorStop(
            1,
            "rgba(255,40,0,0)"
        );


        ctx.fillStyle =
            flame;

        ctx.shadowBlur=25;

        ctx.shadowColor =
            "rgba(255,100,20,.8)";


        ctx.beginPath();

        ctx.moveTo(
            0,
            -f.size*1.5
        );

        ctx.bezierCurveTo(

            -f.size,
            -f.size*.4,

            -f.size*.8,
            f.size*.8,

            0,
            f.size

        );

        ctx.bezierCurveTo(

            f.size*.8,
            f.size*.8,

            f.size,
            -f.size*.4,

            0,
            -f.size*1.5

        );

        ctx.closePath();

        ctx.fill();

        ctx.restore();


        if(f.life<=0){

            flames.splice(
                i,
                1
            );

        }

    }


    /* =========================================
       طاقة السلام
    ========================================= */

    for(
        let i=energy.length-1;
        i>=0;
        i--
    ){

        const e =
            energy[i];


        e.x +=
            e.vx*dt*.05;

        e.y +=
            e.vy*dt*.05;


        e.life -=
            dt*.004;


        ctx.beginPath();

        ctx.arc(

            e.x,

            e.y,

            e.size,

            0,

            Math.PI*2

        );


        ctx.fillStyle =
            `rgba(180,235,255,${Math.max(
                0,
                e.life
            )})`;


        ctx.shadowBlur=18;

        ctx.shadowColor =
            "rgba(120,220,255,.9)";


        ctx.fill();


        if(e.life<=0){

            energy.splice(
                i,
                1
            );

        }

    }


    /* =========================================
       الانفجارات
    ========================================= */

    for(
        let i=bursts.length-1;
        i>=0;
        i--
    ){

        const p =
            bursts[i];


        p.x +=
            p.vx*dt*.06;

        p.y +=
            p.vy*dt*.06;


        p.vx*=.97;

        p.vy*=.97;


        p.life -=
            p.decay*dt;


        ctx.beginPath();

        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI*2

        );


        ctx.fillStyle =

            `rgba(255,255,255,${Math.max(
                0,
                p.life
            )})`;


        ctx.shadowBlur=14;

        ctx.shadowColor =
            "rgba(160,220,255,.9)";


        ctx.fill();


        if(p.life<=0){

            bursts.splice(
                i,
                1
            );

        }

    }


    /* =========================================
       الدوائر
    ========================================= */

    for(
        let i=rings.length-1;
        i>=0;
        i--
    ){

        const r =
            rings[i];


        r.r +=
            dt*.22;

        r.life -=
            dt*.0018;


        ctx.beginPath();

        ctx.arc(

            r.x,

            r.y,

            r.r,

            0,

            Math.PI*2

        );


        ctx.strokeStyle =

            `rgba(190,225,255,${Math.max(
                0,
                r.life
            )})`;


        ctx.lineWidth=2;

        ctx.shadowBlur=20;

        ctx.shadowColor =
            "rgba(180,225,255,.8)";


        ctx.stroke();


        if(
            r.r>r.max ||
            r.life<=0
        ){

            rings.splice(
                i,
                1
            );

        }

    }


    /* =========================================
       المسارات
    ========================================= */

    for(
        let i=trails.length-1;
        i>=0;
        i--
    ){

        const t =
            trails[i];


        t.life -=
            dt*.003;

        t.size*=.98;


        ctx.beginPath();

        ctx.arc(

            t.x,

            t.y,

            Math.max(
                1,
                t.size
            ),

            0,

            Math.PI*2

        );


        ctx.fillStyle =

            `rgba(190,225,255,${Math.max(
                0,
                t.life*.5
            )})`;


        ctx.fill();


        if(t.life<=0){

            trails.splice(
                i,
                1
            );

        }

    }


    requestAnimationFrame(
        animate
    );

}

requestAnimationFrame(
    animate
);


/* =========================================================
   تشغيل الكاميرا الخلفية فقط
========================================================= */

async function startCamera(){

    error.classList.remove(
        "show"
    );


    try{

        /*
         * إيقاف الكاميرا القديمة
         */

        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );

            stream=null;

        }


        /*
         * التأكد من دعم الكاميرا
         */

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "المتصفح لا يدعم الكاميرا"
            );

        }


        /*
         * الكاميرا الخلفية
         *
         * environment = الخلفية
         */

        const newStream =

            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:{
                            exact:"environment"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30,
                            max:30
                        }

                    },

                    audio:false

                });


        stream =
            newStream;


        /*
         * ربط الفيديو
         */

        video.srcObject =
            stream;


        video.style.transform =
            "none";


        await video.play();


        /*
         * إخفاء شاشة البداية
         */

        center.classList.add(
            "hidden"
        );

        start.style.display =
            "none";


        running=true;


        statusEl.textContent =
            "جاري تشغيل الكاميرا الخلفية";


        /*
         * MediaPipe Hands
         */

        hands =
            new Hands({

                locateFile:
                    file =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

            });


        hands.setOptions({

            maxNumHands:1,

            modelComplexity:1,

            minDetectionConfidence:.55,

            minTrackingConfidence:.55

        });


        hands.onResults(
            onResults
        );


        /*
         * معالجة الفيديو
         */

        async function process(){

            if(!running)
                return;


            if(
                video.readyState>=2
            ){

                try{

                    await hands.send({

                        image:video

                    });

                }

                catch(e){

                    console.warn(
                        "Hand tracking:",
                        e
                    );

                }

            }


            requestAnimationFrame(
                process
            );

        }


        process();

    }


    catch(e){

        console.error(
            "Camera error:",
            e
        );


        /*
         * إذا exact environment
         * غير مدعوم على الجهاز
         */

        if(
            e.name ===
            "OverconstrainedError"
        ){

            errorText.innerHTML =

                "ما قدرنا نختار الكاميرا الخلفية.<br><br>" +

                "تأكد أن جهازك يحتوي على كاميرا خلفية ثم حاول مرة ثانية.";

        }


        else if(
            e.name ===
            "NotAllowedError"
        ){

            errorText.innerHTML =

                "تم رفض إذن الكاميرا.<br><br>" +

                "افتح إعدادات المتصفح ← أذونات الموقع ← الكاميرا ← سماح، ثم ارجع للموقع واضغط إعادة المحاولة.";

        }


        else if(
            e.name ===
            "NotFoundError"
        ){

            errorText.textContent =

                "ماكو كاميرا خلفية متاحة على هذا الجهاز.";

        }


        else if(
            e.name ===
            "NotReadableError"
        ){

            errorText.textContent =

                "الكاميرا مستخدمة حاليًا من تطبيق أو موقع آخر. أغلقه وجرب مرة ثانية.";

        }


        else if(
            e.name ===
            "SecurityError"
        ){

            errorText.textContent =

                "المتصفح منع الكاميرا. افتح الموقع باستخدام HTTPS.";

        }


        else{

            errorText.textContent =

                "ما قدرنا نفتح الكاميرا الخلفية. تأكد من صلاحية الكاميرا وأن الموقع يعمل عبر HTTPS، ثم حاول مرة ثانية.";

        }


        error.classList.add(
            "show"
        );


        statusEl.textContent =
            "تعذر تشغيل الكاميرا";


        dot.classList.remove(
            "ok"
        );

    }

}


/* =========================================================
   الأزرار
========================================================= */

start.addEventListener(
    "click",
    startCamera
);


document
    .getElementById("retry")
    .addEventListener(
        "click",
        startCamera
    );

</script>
